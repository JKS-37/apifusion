{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}API Fusion{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'teams/css/style.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="brand">🔗 API Fusion</div>
        {% if user.is_authenticated %}
        <nav class="nav-right">
            <span class="team-tag">{{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-ghost">Logout</a>
        </nav>
        {% endif %}
    </header>
    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">API Fusion Ideathon &middot;</footer>
</body>
</html>
